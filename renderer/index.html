<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>番仓 AniVault</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>番仓 AniVault</h1>
    <span class="sub">AGE 动漫自动追更 · 配置面板</span>
    <span class="version-badge">v0.10.0</span>
    <span id="status" class="status"></span>
  </header>
  <main>
    <section id="global">
      <h2>全局设置</h2>
      <div class="field-row">
        <span class="field-label">每日抓取时间</span>
        <input id="fetch_time" type="text" placeholder="18:00，留空 = 关闭">
      </div>
      <div class="field-row">
        <span class="field-label">站点地址</span>
        <input id="base_url" type="text" placeholder="留空 = https://www.agedm.io">
      </div>
      <div class="field-row">
        <span class="field-label">单次最多下载</span>
        <input id="max_download" type="number" min="0" step="1" class="num">
        <span class="hint">0 = 不限</span>
      </div>
      <div class="field-row">
        <span class="field-label">并发下载数</span>
        <input id="max_parallel" type="number" min="1" max="10" step="1" value="1" class="num">
        <span class="hint">范围 1-10，推荐：3</span>
      </div>
      <div class="field-row">
        <span class="field-label">下载引擎</span>
        <select id="download_engine">
          <option value="aria2">aria2（默认）</option>
          <option value="idm">IDM（仅交互模式）</option>
          <option value="ffmpeg">ffmpeg</option>
        </select>
      </div>
      <div class="field-row">
        <span class="field-label">单次等待上限</span>
        <input id="attempt_timeout_min" type="number" min="5" max="60" step="1" value="20" class="num">
        <span class="hint">分钟，范围 5-60，默认 20</span>
      </div>
      <label class="check">
        <input id="auto_repair" type="checkbox"> 缺失集自动补下
      </label>
      <label class="check">
        <input id="auto_close_idm" type="checkbox"> 下载完成后自动关闭 IDM
      </label>
      <div id="global-errors" class="errors"></div>
    </section>
    <section id="anime">
      <div class="section-head">
        <h2>追番清单</h2>
        <button id="add-anime">+ 添加番剧</button>
      </div>
      <div id="anime-list"></div>
    </section>
    <section id="mpv-sync">
      <div class="section-head">
        <div>
          <h2>mpv 观看同步</h2>
          <span class="hint">可选模块。安装后默认关闭；单部番剧还需在 folder_name 中加入一个 {watched}。</span>
        </div>
        <span id="mpv-sync-state" class="run-status">尚未检查</span>
      </div>
      <div class="mpv-sync-row">
        <label>mpv 根目录
          <input id="mpv-sync-root" type="text" placeholder="例如 F:\Backend\mpv.lite">
        </label>
        <div class="run-buttons">
          <button id="mpv-sync-check">检查状态</button>
          <button id="mpv-sync-install" class="primary">安装</button>
          <button id="mpv-sync-toggle">启用</button>
          <button id="mpv-sync-update">更新</button>
          <button id="mpv-sync-uninstall" class="danger">卸载</button>
        </div>
      </div>
      <div id="mpv-sync-message" class="hint"></div>
    </section>
    <section id="run">
      <h2>运行控制</h2>
      <div class="run-buttons">
        <button id="run-dry" class="primary">Dry-run 检查更新</button>
        <button id="run-full" class="primary">立即下载</button>
        <button id="stop-run">停止</button>
        <button id="open-download">打开下载目录</button>
      </div>
      <div id="run-status" class="run-status">空闲</div>
      <div id="schedule-status" class="schedule-status"></div>
      <div id="episode-status" class="episode-status"></div>
      <div class="run-columns">
        <div>
          <h3>运行日志</h3>
          <div id="log-area" class="log"></div>
        </div>
        <div>
          <div class="csv-head">
            <h3>待下载清单</h3>
            <button id="csv-refresh">刷新</button>
          </div>
          <div class="csv-scroll">
            <table id="csv-table">
              <thead>
                <tr><th>动漫</th><th>集数</th><th>播放页URL</th><th>已下载/总数</th><th>操作</th></tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
      <details id="env-info-box">
        <summary>环境信息（只读）</summary>
        <pre id="env-info"></pre>
      </details>
    </section>
  </main>
  <footer>
    <button id="save" class="primary">保存配置</button>
    <button id="reload">放弃修改并重新载入</button>
    <span id="save-msg" class="save-msg"></span>
  </footer>
  <script src="renderer.js"></script>
</body>
</html>
