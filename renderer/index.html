<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>番仓 AniVault</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>番仓 AniVault</h1>
    <span class="sub">AGE 动漫自动追更 · 配置面板 Demo</span>
    <span id="status" class="status"></span>
  </header>
  <main>
    <section id="global">
      <h2>全局设置</h2>
      <label>每日抓取时间
        <input id="fetch_time" type="text" placeholder="18:00">
      </label>
      <label>每日自动运行时间（HH:MM，留空关闭）
        <input id="auto_run_time" type="text" placeholder="留空 = 关闭">
      </label>
      <label>单次最多下载（0 = 不限）
        <input id="max_download" type="number" min="0" step="1">
      </label>
      <label>并发下载数（1-10）
        <input id="max_parallel" type="number" min="1" max="10" step="1" value="1">
        <span class="hint">推荐：3</span>
      </label>
      <label>下载引擎
        <select id="download_engine">
          <option value="aria2">aria2（默认）</option>
          <option value="idm">IDM（仅交互模式）</option>
          <option value="ffmpeg">ffmpeg</option>
        </select>
      </label>
      <label>单次下载等待上限（分钟，5-60）
        <input id="attempt_timeout_min" type="number" min="5" max="60" step="1" value="20">
        <span class="hint">默认 20，替代固定 45 分钟</span>
      </label>
      <label class="check">
        <input id="auto_repair" type="checkbox"> 缺失集自动补下
      </label>
      <label class="check">
        <input id="auto_close_idm" type="checkbox"> 下载完成后自动关闭 IDM
      </label>
      <div id="global-errors" class="errors"></div>
    </section>
    <section id="anime">
      <div class="section-head">
        <h2>追番清单</h2>
        <button id="add-anime">+ 添加番剧</button>
      </div>
      <div id="anime-list"></div>
    </section>
    <section id="run">
      <h2>运行控制</h2>
      <div class="run-buttons">
        <button id="run-dry" class="primary">Dry-run 检查更新</button>
        <button id="run-full" class="primary">立即下载</button>
        <button id="stop-run">停止</button>
        <button id="open-download">打开下载目录</button>
      </div>
      <div id="run-status" class="run-status">空闲</div>
      <div id="schedule-status" class="schedule-status"></div>
      <div id="episode-status" class="episode-status"></div>
      <div class="run-columns">
        <div>
          <h3>运行日志</h3>
          <div id="log-area" class="log"></div>
        </div>
        <div>
          <div class="csv-head">
            <h3>待下载清单</h3>
            <button id="csv-refresh">刷新</button>
          </div>
          <table id="csv-table">
            <thead>
              <tr><th>动漫</th><th>集数</th><th>播放页URL</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
      <details id="env-info-box">
        <summary>环境信息（只读）</summary>
        <pre id="env-info"></pre>
      </details>
    </section>
  </main>
  <footer>
    <button id="save" class="primary">保存配置</button>
    <button id="reload">放弃修改并重新载入</button>
    <span id="save-msg" class="save-msg"></span>
  </footer>
  <script src="renderer.js"></script>
</body>
</html>
